<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121a3b">
  <title>{% block title %}PlagiScan · Plagiarism checker{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23121a3b'/%3E%3Crect x='6' y='11' width='20' height='6' rx='2' fill='%23ffe14d'/%3E%3Crect x='6' y='20' width='13' height='3' rx='1.5' fill='%23fff' opacity='.85'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="nav-shell">
      <a class="brand" href="{{ url_for('index') }}" aria-label="PlagiScan home">
        <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
        <span>PlagiScan</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="{{ url_for('index') }}">New check</a>
      </nav>
    </div>
  </header>

  <main class="app-shell">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <strong>PlagiScan</strong>
    <span>Plagiarism checker for papers, assignments and articles.</span>
  </footer>
</body>
</html>
